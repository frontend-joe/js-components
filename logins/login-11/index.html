<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logins</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <div class="card">
      <div class="card-bg card-bg-1"></div>
      <div class="card-bg card-bg-2"></div>

      <div class="switch login">
        <div class="switch-brand">
          <img class="logo" src="logo.svg" alt="" />
          <span class="brand">Qube.ai</span>
        </div>

        <button type="button" class="switch-btn">
          Sign up
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>

      <div class="switch register">
        <div class="switch-brand">
          <img class="logo" src="logo.svg" alt="" />
          <span class="brand">Qube.ai</span>
        </div>

        <button type="button" class="switch-btn">
          Login
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>

      <div class="form login">
        <form>
          <div>
            <h2 class="form-title">Login</h2>
          </div>

          <label class="field">
            <span class="material-symbols-outlined icon">mail</span>
            <input type="email" placeholder="Email" />
          </label>

          <label class="field">
            <span class="material-symbols-outlined icon">lock</span>
            <input type="password" placeholder="Password" />
            <button type="button" class="reveal" aria-label="Show password">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </label>

          <div class="form-row">
            <label class="check">
              <input type="checkbox" />
              <span class="box"></span>
              Remember me
            </label>
            <a href="#" class="link">Forget password?</a>
          </div>

          <button type="submit">Login</button>

          <span class="or"></span>

          <button type="button" class="social-btn">
            <img src="google.svg" alt="" />
            <p>Continue with Google</p>
          </button>

          <p class="legal">
            By logging into the Qube.ai application, you are agreeing to the
            <a href="#">Terms &amp; Conditions</a> and
            <a href="#">Privacy Policy</a>.
          </p>
        </form>
      </div>

      <div class="form register">
        <form>
          <div>
            <h2 class="form-title">Sign up</h2>
          </div>

          <label class="field">
            <span class="material-symbols-outlined icon">mail</span>
            <input type="email" placeholder="Email" />
          </label>

          <label class="field">
            <span class="material-symbols-outlined icon">lock</span>
            <input type="password" placeholder="Password" />
            <button type="button" class="reveal" aria-label="Show password">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </label>

          <div class="form-row">
            <label class="check">
              <input type="checkbox" />
              <span class="box"></span>
              I agree to the terms
            </label>
          </div>

          <button type="submit">Sign up</button>

          <span class="or"></span>

          <button type="button" class="social-btn">
            <img src="google.svg" alt="" />
            <p>Continue with Google</p>
          </button>

          <p class="legal">
            By signing up for the Qube.ai application, you are agreeing to the
            <a href="#">Terms &amp; Conditions</a> and
            <a href="#">Privacy Policy</a>.
          </p>
        </form>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
